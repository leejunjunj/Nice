<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대한민국 맞춤형 정부 정책 통합 알리미</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --star: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1280px; margin: 0 auto; line-height: 1.5; }

    header { text-align: center; padding: 20px 0; margin-bottom: 20px; }
    header h1 { font-size: 2rem; color: var(--primary); font-weight: 800; }
    header p { color: #64748b; font-size: 0.95rem; margin-top: 6px; }

    /* 1. 조건 선택 박스 영역 */
    .filter-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .picker-group { display: flex; flex-direction: column; }
    .picker-group label { font-weight: 700; font-size: 0.85rem; color: #475569; margin-bottom: 8px; text-align: center; }

    .select-box {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #f1f5f9;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .select-box:focus { border-color: var(--primary); background: #fff; }

    .search-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .search-btn:hover { background: var(--primary-hover); }

    /* 레이아웃 & 섹션 */
    .section-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin: 32px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .policy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* 2. 정책 카드 스타일 */
    .policy-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .policy-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08); }

    .star-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 1.5rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s, transform 0.1s;
    }
    .star-btn:hover { transform: scale(1.15); }
    .star-btn.active { color: var(--star); }

    .badge-container { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-ongoing { background: #dcfce7; color: #15803d; }
    .badge-upcoming { background: #fef3c7; color: #b45309; }
    .badge-cat { background: #e0e7ff; color: #3730a3; }

    .policy-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; padding-right: 28px; line-height: 1.3; }
    .policy-card p { font-size: 0.88rem; color: #475569; margin-bottom: 14px; line-height: 1.45; }
    .policy-meta { font-size: 0.78rem; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 10px; }

    .empty-msg { color: #94a3b8; font-size: 0.95rem; padding: 24px 0; width: 100%; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>대한민국 맞춤형 정부 정책 통합 알리미</h1>
    <p>내 조건만 선택하면 받을 수 있는 모든 혜택 및 신청 사이트를 안내해 드립니다.</p>
  </header>

  <!-- 1. 필터링 영역 -->
  <section class="filter-card">
    <div class="picker-grid">
      <div class="picker-group">
        <label>성별</label>
        <select id="filter-gender" class="select-box">
          <option value="전체">전체</option>
          <option value="남성">남성</option>
          <option value="여성">여성</option>
        </select>
      </div>
      <div class="picker-group">
        <label>나이</label>
        <select id="filter-age" class="select-box">
          <option value="전체">전체</option>
          <option value="19">19세 이하</option>
          <option value="25">20~29세</option>
          <option value="35">30~39세</option>
          <option value="45">40~49세</option>
          <option value="60">50세 이상</option>
        </select>
      </div>
      <div class="picker-group">
        <label>직업 상태</label>
        <select id="filter-job" class="select-box">
          <option value="전체">전체</option>
          <option value="대학생">대학생/대학원생</option>
          <option value="취업준비생">취업준비생/구직자</option>
          <option value="직장인">직장인/근로자</option>
          <option value="군인">군인/의무복무자</option>
          <option value="자영업자">자영업자/소상공인</option>
        </select>
      </div>
      <div class="picker-group">
        <label>거주 지역</label>
        <select id="filter-region" class="select-box">
          <option value="전체">전국 (공통)</option>
          <option value="서울">서울특별시</option>
          <option value="경기">경기도</option>
          <option value="부산">부산광역시</option>
          <option value="기타">기타 광역시/도</option>
        </select>
      </div>
      <div class="picker-group">
        <label>소득 구간</label>
        <select id="filter-income" class="select-box">
          <option value="전체">전체</option>
          <option value="저소득">중위소득 50% 이하 (저소득)</option>
          <option value="중위소득">중위소득 100% 이하</option>
          <option value="일반">중위소득 100% 초과/상관없음</option>
        </select>
      </div>
      <div class="picker-group">
        <label>소득 수단</label>
        <select id="filter-source" class="select-box">
          <option value="전체">전체</option>
          <option value="근로소득">근로소득</option>
          <option value="사업소득">사업소득</option>
          <option value="무소득">무소득/보조금</option>
        </select>
      </div>
    </div>
    <button class="search-btn" onclick="renderAll()">🔍 맞춤 정책 검색하기</button>
  </section>

  <!-- 3. 별표(즐겨찾기) 정책 섹션 -->
  <section id="starred-section">
    <h2 class="section-title">⭐ 즐겨찾기한 정책</h2>
    <div class="policy-grid" id="starred-grid"></div>
  </section>

  <!-- 4. 신청 예정 정책 섹션 -->
  <section id="upcoming-section">
    <h2 class="section-title">📅 신청 예정 정책</h2>
    <div class="policy-grid" id="upcoming-grid"></div>
  </section>

  <!-- 2. 카테고리/섹터별 정책 섹션 -->
  <section id="category-section"></section>

  <script>
    // 현재 기준일 (자동 마감 처리 검증용)
    const todayStr = "2026-10-01";

    // 실제 대한민국 정부/지자체 주요 정책 데이터베이스 (실제 존재하는 정보 기반)
    const policyDatabase = [

      },
      {

        jobs: ["군인"],

        link: "https://www.mma.go.kr",

      },
      {

        desc: "취업을 희망하는 구직자에게 취업지원서비스 및 구직촉진수당(월 50만원×6개월) 제공",

      },
      {

        jobs: ["전체"],

      },
      {

        category: "소상공인/자영업",
        desc: "영세 소상공인의 경영 부담 완화를 위해 전기요금을 사업자당 최대 20만 원 직접 지원",

        status: "ongoing"
      },
      {
        id: 9,
        title: "2027년도 상반기 대학생 근로장학금 모집",
        category: "대학생",
        desc: "교내외 근로 참여 대학생 대상 학자금 마련 지원사업",
        jobs: ["대학생"],
        region: "전체",
        income: "전체",
        link: "https://www.kosaf.go.kr",
        startDate: "2027-01-15",
        endDate: "2027-02-28",
        status: "upcoming" // 신청 예정
      },
      {
        id: 10,
        title: "청년 문화예술패스",
        category: "문화/교통",
        desc: "19세 청년(2005년생) 대상 연 최대 15만 원 공연·전시 관람비 지원",
        jobs: ["전체", "대학생", "취업준비생"],
        region: "전체",
        income: "전체",
        link: "https://www.korea.kr",
        startDate: "2024-03-28",
        endDate: "2026-11-30",
        status: "ongoing"
      }
    ];

    let starredIds = new Set();

    // 4. 마감 정책 자동 제거 및 필터링 함수
    function getFilteredPolicies() {
      const gender = document.getElementById('filter-gender').value;
      const age = document.getElementById('filter-age').value;
      const job = document.getElementById('filter-job').value;
      const region = document.getElementById('filter-region').value;
      const income = document.getElementById('filter-income').value;

      return policyDatabase.filter(policy => {
        // [자동 마감 처리] 마감 기한이 지난 정책은 쌓이지 않고 삭제(제외)
        if (policy.endDate < todayStr) return false;

        // 직업 조건 필터
        if (job !== '전체' && !policy.jobs.includes('전체') && !policy.jobs.includes(job)) {
          return false;
        }

        // 지역 조건 필터
        if (region !== '전체' && policy.region !== '전체' && policy.region !== region) {
          return false;
        }

        // 소득 조건 필터
        if (income !== '전체' && policy.income !== '전체' && policy.income !== income) {
          return false;
        }

        return true;
      });
    }

    // 카드 HTML 생성
    function createCard(policy) {
      const isStarred = starredIds.has(policy.id);
      const isUpcoming = policy.startDate > todayStr || policy.status === 'upcoming';
      const badgeText = isUpcoming ? '접수 예정' : '신청 가능';
      const badgeClass = isUpcoming ? 'badge-upcoming' : 'badge-ongoing';

      return `
        <div class="policy-card" onclick="window.open('${policy.link}', '_blank')">
          <span class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleStar(event, ${policy.id})">★</span>
          <div>
            <div class="badge-container">
              <span class="badge ${badgeClass}">${badgeText}</span>
              <span class="badge badge-cat">${policy.category}</span>
            </div>
            <h3>${policy.title}</h3>
            <p>${policy.desc}</p>
          </div>
          <div class="policy-meta">
            신청기간: ${policy.startDate} ~ ${policy.endDate}
          </div>
        </div>
      `;
    }

    // 별표 토글 함수
    function toggleStar(event, id) {
      event.stopPropagation(); // 카드 클릭 시 사이트 이동 방지
      if (starredIds.has(id)) {
        starredIds.delete(id);
      } else {
        starredIds.add(id);
      }
      renderAll();
    }

    // 화면 종합 랜더링
    function renderAll() {
      const filtered = getFilteredPolicies();

      // A. 별표(즐겨찾기) 정책
      const starredGrid = document.getElementById('starred-grid');
      const starredList = filtered.filter(p => starredIds.has(p.id));
      starredGrid.innerHTML = starredList.length === 0
        ? `<p class="empty-msg">오른쪽 위 별표(★)를 눌러 관심 있는 정책을 보관하세요.</p>`
        : starredList.map(p => createCard(p)).join('');

      // B. 신청 예정 정책
      const upcomingGrid = document.getElementById('upcoming-grid');
      const upcomingList = filtered.filter(p => p.startDate > todayStr || p.status === 'upcoming');
      upcomingGrid.innerHTML = upcomingList.length === 0
        ? `<p class="empty-msg">현재 검색 조건에 해당하는 예정 정책이 없습니다.</p>`
        : upcomingList.map(p => createCard(p)).join('');

      // C. 카테고리(섹터)별 정책
      const ongoingList = filtered.filter(p => p.startDate <= todayStr && p.status === 'ongoing');
      const categories = ["주거/월세", "서민금융/자산", "취업/창업", "대학생", "군인", "소상공인/자영업", "문화/교통"];
      const categorySection = document.getElementById('category-section');

      let categoryHtml = '';
      categories.forEach(cat => {
        const catPolicies = ongoingList.filter(p => p.category === cat);
        categoryHtml += `
          <h2 class="section-title">📌 ${cat} 지원 정책</h2>
          <div class="policy-grid">
            ${catPolicies.length === 0 
              ? `<p class="empty-msg">해당 조건에 해당하는 진행 중인 정책이 없습니다.</p>`
              : catPolicies.map(p => createCard(p)).join('')}
          </div>
        `;
      });

      categorySection.innerHTML = categoryHtml;
    }

    // 초기화
    window.onload = () => {
      renderAll();
    };
  </script>
</body>
</html>
